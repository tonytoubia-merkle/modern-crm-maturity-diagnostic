name: Deploy to AWS App Runner

# Manual-only for now (workflow_dispatch) so it never runs — or fails — until
# AWS is wired up. Once the repo variables/secrets below are set, run it from
# the Actions tab. To deploy automatically on merge, add a `push: branches:
# [main]` trigger.
on:
  workflow_dispatch:

# Required for OIDC role assumption (no long-lived AWS keys stored in GitHub).
permissions:
  id-token: write
  contents: read

# Configure these under Settings → Secrets and variables → Actions:
#   Variables: AWS_REGION, ECR_REPOSITORY, APP_RUNNER_SERVICE_ARN,
#              NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#              NEXT_PUBLIC_APP_URL
#   Secrets:   AWS_DEPLOY_ROLE_ARN   (IAM role trusting GitHub's OIDC provider)
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight — require AWS configuration
        run: |
          missing=0
          for v in "AWS_REGION=${{ vars.AWS_REGION }}" \
                   "ECR_REPOSITORY=${{ vars.ECR_REPOSITORY }}" \
                   "APP_RUNNER_SERVICE_ARN=${{ vars.APP_RUNNER_SERVICE_ARN }}" \
                   "AWS_DEPLOY_ROLE_ARN=${{ secrets.AWS_DEPLOY_ROLE_ARN }}"; do
            if [ -z "${v#*=}" ]; then echo "::error::Missing ${v%%=*}"; missing=1; fi
          done
          [ "$missing" = "0" ] || { echo "Set the repo variables/secrets first (see workflow comments)."; exit 1; }

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ vars.NEXT_PUBLIC_APP_URL }}" \
            -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"

      - name: Trigger App Runner deployment
        run: |
          aws apprunner start-deployment \
            --service-arn "${{ vars.APP_RUNNER_SERVICE_ARN }}" \
            --region "${{ vars.AWS_REGION }}"
